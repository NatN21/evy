<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evy</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#6b5b45">
  <link rel="icon" href="/web/icone-192.png">
  <link rel="apple-touch-icon" href="/web/icone-192.png">
  <script>
    // Aplica o tema salvo antes de pintar a página (evita "flash" claro)
    (function () {
      var t = localStorage.getItem("tema");
      if (t === "claro" || t === "escuro") document.documentElement.dataset.tema = t;
    })();
  </script>
  <link rel="stylesheet" href="/web/estilo.css?v=3">
</head>
<body>
  <header>
    <button id="abrir-menu" type="button" aria-label="Abrir menu">&#9776;</button>
    <span>EVY</span>
  </header>

  <div id="fundo-menu" hidden></div>
  <aside id="menu">
    <div class="menu-topo">
      <strong>EVY</strong>
      <button id="fechar-menu" type="button" aria-label="Fechar menu">&#10005;</button>
    </div>
    <button class="item-menu" type="button" data-painel="memoria">Memória</button>
    <button class="item-menu" type="button" data-painel="lembretes">Lembretes</button>
    <button class="item-menu" type="button" data-painel="dispositivos">Dispositivos</button>

    <div class="seletor-tema" role="group" aria-label="Tema">
      <button type="button" data-tema="sistema">Sistema</button>
      <button type="button" data-tema="claro">Claro</button>
      <button type="button" data-tema="escuro">Escuro</button>
    </div>
  </aside>

  <main id="conversa"></main>
  <form id="formulario">
    <textarea id="campo" rows="1" placeholder="Escreva para a Evy..." autocomplete="off"></textarea>
    <button id="enviar" type="submit" aria-label="Enviar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </button>
  </form>

  <section id="painel-memoria" hidden>
    <div class="cartao">
      <div class="topo">
        <strong id="titulo-painel"></strong>
        <button id="fechar-painel" type="button">Fechar</button>
      </div>
      <div id="controles-avisos" hidden>
        <span id="estado-avisos"></span>
        <button id="ativar-avisos" type="button">Ativar avisos</button>
        <button id="testar-avisos" type="button">Testar</button>
      </div>
      <ul id="lista-memoria"></ul>
    </div>
  </section>

  <script src="/web/app.js?v=3"></script>
</body>
</html>
